theme = "rose_pine"
# other variants: "rose_pine_moon", "rose_pine_dawn"

[editor]
line-number = "relative"
cursorline = true
cursorcolumn = false
bufferline = "multiple"
color-modes = true
true-color = true
rulers = [80, 100]
auto-save = true
idle-timeout = 200
completion-trigger-len = 1
auto-pairs = true
auto-completion = true
undercurl = true
end-of-line-diagnostics = "hint"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "╎"
skip-levels = 1

[editor.whitespace.render]
space = "none"
tab = "all"
newline = "none"

[editor.file-picker]
hidden = false

[keys.normal]
C-s = ":w"
C-q = ":q"
